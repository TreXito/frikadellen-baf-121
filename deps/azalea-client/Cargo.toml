[package]
name = "azalea-client"
version = "0.16.0+mc26.3"
edition = "2024"
description = "A headless Minecraft client."
license = "MIT"
repository = "https://github.com/azalea-rs/azalea"
build = "build.rs"

# Keep every internal dependency on the exact same Azalea revision as the root
# crate. Mixing these with crates.io's mc26.1 packages would create incompatible
# ECS, component, and packet types even though their version numbers match.
[dependencies]
async-compat = "0.2.5"
azalea-auth = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
azalea-block = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
azalea-buf = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
azalea-chat = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
azalea-core = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
azalea-crypto = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
azalea-entity = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
azalea-inventory = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
azalea-physics = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
azalea-protocol = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false, features = ["connecting", "bevy_ecs"] }
azalea-registry = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
azalea-world = { git = "https://github.com/azalea-rs/azalea", rev = "8041a14706fbdb2b8c481d2e8960d7411e850796", default-features = false }
bevy_app = "0.19.0"
bevy_ecs = { version = "0.19.0", default-features = false, features = ["multi_threaded"] }
bevy_log = { version = "0.19.0", optional = true }
bevy_tasks = "0.19.0"
bevy_time = "0.19.0"
bevy_utils = { version = "0.19.0", default-features = false, features = ["debug"] }
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut"] }
indexmap = "2.14.0"
minecraft_folder_path = "0.1.2"
parking_lot = "0.12.5"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["socks"], optional = true }
simdnbt = "0.10.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["sync"] }
tracing = "0.1.44"
uuid = "1.23.4"

[dev-dependencies]
eyre = "0.6.12"

[features]
default = ["log", "packet-event", "online-mode"]
log = ["bevy_log"]
packet-event = []
online-mode = [
    "azalea-auth/online-mode",
    "azalea-protocol/online-mode",
    "dep:reqwest",
]
