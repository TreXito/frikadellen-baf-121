[package]
name = "frikadellen_baf"
version = "3.0.0"
edition = "2021"
authors = ["TreXito"]
description = "Frikadellen BAF (Bazaar Auction Flipper) for Hypixel Skyblock - Rust port using Azalea"
license = "AGPL-3.0"

[[bin]]
name = "frikadellen_baf"
path = "src/main.rs"

[[bin]]
name = "FrikadellenBAF-loader"
path = "src/loader.rs"

[dependencies]
# Azalea 26.3 plus the SignTextSlot wire-format fix, based on upstream 26.3.
# mc26.3 has not been published to crates.io, so a fixed revision is required.
azalea = { git = "https://github.com/TreXito/azalea", rev = "202db34d44dcf532e828e7869aacf3ba9a03b16b" }
azalea-protocol = { git = "https://github.com/TreXito/azalea", rev = "202db34d44dcf532e828e7869aacf3ba9a03b16b" }
azalea-inventory = { git = "https://github.com/TreXito/azalea", rev = "202db34d44dcf532e828e7869aacf3ba9a03b16b" }
azalea-client = { git = "https://github.com/TreXito/azalea", rev = "202db34d44dcf532e828e7869aacf3ba9a03b16b" }
azalea-chat = { git = "https://github.com/TreXito/azalea", rev = "202db34d44dcf532e828e7869aacf3ba9a03b16b" }
bevy_app = "0.19"
bevy_ecs = "0.19"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
futures = "0.3"

# Networking
reqwest = { version = "0.13", features = ["json", "blocking", "socks"] }
# SOCKS5 client handshake, same crate azalea-protocol uses for `Connection::new_with_proxy`
socks5-impl = { version = "0.9.1", features = ["client"] }

# HMAC-SHA256 for signing relay notifications (keeps webhook URLs out of source)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
tracing-appender = "0.2"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
once_cell = "1.19"
parking_lot = "0.12"
regex = "1.10"
rand = "0.9"
dirs = "5.0"
# Resolve the same .minecraft dir azalea caches auth into, so `/trex logout`
# can clear exactly the cache file azalea uses.
minecraft_folder_path = "0.1"

# CLI interaction
dialoguer = "0.11"
rustyline = "15.0"

# Web server for control panel
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
# Optional HTTPS for the control panel (user-provided cert, or self-signed fallback)
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
rustls = "0.23"

# OG image generation for link embeds
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[patch."https://github.com/TreXito/azalea"]
# Use the mc26.3 azalea-client with our 300 Hz ECS Update schedule instead of
# the default 60 Hz. This keeps average packet-detection latency near 1.65 ms.
azalea-client = { path = "deps/azalea-client" }
