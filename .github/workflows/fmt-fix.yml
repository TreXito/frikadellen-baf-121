# One-off helper: format the whole tree with the pinned rustfmt and push the
# result. Trigger manually with `gh workflow run fmt-fix.yml --ref main`.
# Delete this file once the fmt/clippy debt is cleared.
name: fmt-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-19
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --all

      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no formatting changes"
          else
            git add -A
            git commit -m "style: cargo fmt under pinned nightly-2026-08-19"
            git push
          fi
