name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustc builds after 2026-08-18 (incl. current stable) break azalea-core's
      # FixedBitSet<const N> with E0284. Pin the last good nightly until upstream fixes it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets
